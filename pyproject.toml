[project]
name = "yfin"
version = "1.0.0"
description = "Compact Python 3.14 Yahoo Finance client returning pyarrow.Table, built on fastreq."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Volker Lorrmann", email = "volker.lorrmann@gmail.com" }]
dependencies = [
    "fastreq>=3.0.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
polars = ["polars>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["uv_build>=0.5.0,<0.12"]
build-backend = "uv_build"

[tool.uv]
# yfin 1.0 depends on fastreq>=3.0.0, which is not yet published to a public index.
# For local development, install the verified fastreq 3.0.0 wheel from its
# isolated build worktree into this project's venv — do NOT commit a local
# path or file URL here. See README "Release sequencing" for details.

[tool.uv_build]
module-name = "yfin"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]  # local imports in test methods are fine

[tool.ruff.lint.pylint]
max-args = 10

[tool.ty.environment]
python-version = "3.14"

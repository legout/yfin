name: CI

on:
  push:
    branches: [main, rewrite/arrow-yahoo-client]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          source .venv/bin/activate
          # Release sequencing: fastreq 3.0.0 must be published before this
          # workflow can pass. Never silently continue with fastreq 2.x.
          uv pip install 'fastreq>=3.0.0'
          uv pip install pyarrow pytest pytest-asyncio ruff ty
          uv pip install -e . --no-deps

      - name: Ruff format check
        run: source .venv/bin/activate && ruff format --check .

      - name: Ruff lint
        run: source .venv/bin/activate && ruff check .

      - name: Type check (ty)
        run: source .venv/bin/activate && ty check src

      - name: Tests
        run: source .venv/bin/activate && pytest -q

      - name: Build
        run: source .venv/bin/activate && uv build

      - name: Import smoke
        run: source .venv/bin/activate && python -c "import yfin; print(yfin.__version__)"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install zensical and mkdocstrings-python
        run: |
          uv venv --python 3.14 .venv-docs
          source .venv-docs/bin/activate
          uv pip install zensical mkdocstrings-python

      # yfin itself is on the import path so mkdocstrings can introspect it.
      - name: Build docs (strict)
        run: |
          source .venv-docs/bin/activate
          cd docs
          # Build from the repo root so mkdocstrings can resolve `../src/yfin`.
          PYTHONPATH=../src zensical build --strict
